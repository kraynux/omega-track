[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-track"
version = "1.5.0"
description = "Profilage d'identite numerique et observation de chemin reseau, omega-track"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "textual>=0.60",
    "dnspython>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "maxminddb>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpserver>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[project.scripts]
omega-track = "omega_track.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_track"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Controle d'imports entre couches (voir ARBORESCENCE.md §1 et
# ~/DEV/SUITE/DECISIONS_ARCHITECTURE.md D-000/D-007) : contrats layers +
# independence copies verbatim depuis omega-check/pyproject.toml (eux-memes
# copies verbatim depuis omega-scan/omega-stress), seuls les contrats
# forbidden de confinement par technologie sont adaptes a l'arborescence
# reelle de TRACK.
[tool.importlinter]
root_package = "omega_track"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Dependency Rule : les couches externes dependent des internes, jamais l'inverse"
type = "layers"
layers = [
    "omega_track.app",
    "omega_track.infrastructure | omega_track.interfaces | omega_track.plugins",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.domain",
    "omega_track.core",
]

[[tool.importlinter.contracts]]
name = "interfaces ne dependent jamais directement de infrastructure"
type = "independence"
modules = [
    "omega_track.interfaces",
    "omega_track.infrastructure",
]

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = [
    "omega_track.core",
    "omega_track.domain",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.infrastructure",
    "omega_track.plugins",
    "omega_track.shared",
    "omega_track.app",
    "omega_track.interfaces.cli",
]
forbidden_modules = ["textual"]

[[tool.importlinter.contracts]]
name = "sqlite3 seulement dans infrastructure.repositories.sqlite"
type = "forbidden"
source_modules = [
    "omega_track.core",
    "omega_track.domain",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.interfaces",
    "omega_track.plugins",
    "omega_track.shared",
]
forbidden_modules = ["sqlite3"]

[[tool.importlinter.contracts]]
name = "dnspython et httpx seulement dans infrastructure (collectors et geoip)"
type = "forbidden"
source_modules = [
    "omega_track.core",
    "omega_track.domain",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.interfaces",
    "omega_track.plugins",
    "omega_track.shared",
]
forbidden_modules = ["dns", "httpx"]

[[tool.importlinter.contracts]]
name = "subprocess seulement dans infrastructure.collectors.network et infrastructure.system"
type = "forbidden"
source_modules = [
    "omega_track.core",
    "omega_track.domain",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.interfaces",
    "omega_track.plugins",
    "omega_track.shared",
    "omega_track.infrastructure.collectors.dns",
    "omega_track.infrastructure.collectors.rdap",
    "omega_track.infrastructure.collectors.certificates",
    "omega_track.infrastructure.collectors.archives",
    "omega_track.infrastructure.collectors.bgp",
    "omega_track.infrastructure.collectors.reputation",
    "omega_track.infrastructure.collectors.organization",
    "omega_track.infrastructure.geoip",
    "omega_track.infrastructure.exporters",
    "omega_track.infrastructure.config",
]
forbidden_modules = ["subprocess"]

[[tool.importlinter.contracts]]
name = "jinja2 seulement dans infrastructure.exporters"
type = "forbidden"
source_modules = [
    "omega_track.core",
    "omega_track.domain",
    "omega_track.application",
    "omega_track.ports",
    "omega_track.interfaces",
    "omega_track.plugins",
    "omega_track.shared",
    "omega_track.infrastructure.config",
    "omega_track.infrastructure.logging",
    "omega_track.infrastructure.collectors",
    "omega_track.infrastructure.geoip",
    "omega_track.infrastructure.repositories",
    "omega_track.infrastructure.system",
]
forbidden_modules = ["jinja2"]
